name: Build Windows Installer

# Builds the real GigaHelpDesk Bubble Setup.exe on a native Windows runner
# (avoids the wine/rcedit/NSIS limitations of building on Linux or macOS).
#
# Run it two ways:
#   1. Automatically on every push to main (build artifact only).
#   2. On version tags such as v1.0.1 (build and publish a GitHub Release).
#   3. On demand from the Actions tab -> "Build Windows Installer" -> "Run workflow".
#
# The finished installer shows up as a downloadable artifact on the
# workflow run's summary page (Actions tab -> pick the run -> Artifacts).

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Build installer
        run: npm run dist -- --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: GigaHelpDesk-Bubble-Setup
          path: dist/*.exe
